<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Молитвослов от Банана</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Ruslan+Display&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1e4c3;--bg2:#e6d4a8;--card:#fbf3dc;--ink:#2e1a14;--soft:#6b4e3d;--red:#8e1b1b;--gold:#b8892b;--head:#4a0f14;--headink:#f6e3b0;--line:#c9a24b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f0a0d;--bg2:#2b1014;--card:#34161a;--ink:#f3e2b8;--soft:#c9ab7c;--red:#e0705f;--gold:#d9b05a;--head:#3a0d12;--headink:#f6e3b0;--line:#a98337;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f0a0d;--bg2:#2b1014;--card:#34161a;--ink:#f3e2b8;--soft:#c9ab7c;--red:#e0705f;--gold:#d9b05a;--head:#3a0d12;--headink:#f6e3b0;--line:#a98337;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'EB Garamond',Georgia,'Times New Roman',serif;font-size:19px;line-height:1.5}
body{background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 60%);min-height:100vh;padding-bottom:84px}
#snd{position:absolute;right:12px;top:12px;background:none;border:1px solid var(--gold);color:var(--headink);border-radius:6px;font-size:18px;padding:2px 8px}
header{background:linear-gradient(var(--head),#5e1519);color:var(--headink);text-align:center;padding:20px 16px 18px;border-bottom:3px double var(--gold);position:relative}
header .cross{width:34px;height:44px;margin:0 auto 4px;display:block}
h1{font-family:'Ruslan Display','Cormorant SC',Georgia,serif;font-weight:400;font-size:30px;margin:0;letter-spacing:.04em;color:var(--headink)}
.sub{font-family:'Cormorant SC',Georgia,serif;font-size:14px;letter-spacing:.14em;opacity:.85}
.date{font-style:italic;font-size:15px;opacity:.9;margin-top:4px}
main{max-width:640px;margin:0 auto;padding:16px}
.orn{text-align:center;color:var(--gold);letter-spacing:.5em;margin:14px 0;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line);padding:18px 20px;margin-bottom:14px}
h2{font-family:'Cormorant SC',Georgia,serif;font-size:23px;color:var(--red);margin:0 0 6px;text-align:center;letter-spacing:.05em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;border:1px solid var(--gold);background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:5px 14px;border-radius:20px}
.chip.on{background:var(--red);color:#fbf3dc;border-color:var(--red)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.item .n{font-family:'Ruslan Display',serif;color:var(--red);font-size:26px;width:30px;text-align:center}
.item b{font-weight:500;display:block}.item small{color:var(--soft);font-style:italic}
.btn{display:block;width:100%;font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:18px;letter-spacing:.08em;color:#fbf3dc;background:linear-gradient(#a52222,#7a1414);border:1px solid var(--gold);border-radius:6px;padding:12px;margin-top:10px}
.btn.alt{background:transparent;color:var(--red);border-color:var(--red)}
.row{display:flex;gap:10px}.row .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--head);border-top:3px double var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--headink);opacity:.6;font-family:'Cormorant SC',Georgia,serif;font-size:14px;letter-spacing:.06em;padding:9px 0 8px}
nav button.on{opacity:1;color:#f0c75e}nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.reader{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:none}
.reader.show{display:block}
.rbar{position:sticky;top:0;background:var(--head);color:var(--headink);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:3px double var(--gold)}
.rbar button{background:none;border:1px solid var(--gold);color:var(--headink);font:inherit;border-radius:5px;padding:2px 12px}
.txt p{margin:0 0 .8em;text-align:justify;hyphens:auto}
.txt p:first-child::first-letter{font-family:'Ruslan Display',serif;color:var(--red);font-size:3.1em;float:left;line-height:.85;padding:4px 8px 0 0}
.instr{font-style:italic;color:var(--soft);text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px;flex-wrap:wrap}.dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold)}.dots i.d{background:var(--gold)}.dots i.c{background:var(--red);border-color:var(--red)}
.rem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line)}
.rem:last-child{border:0}.rem div{flex:1}.rem input[type=time]{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.rem .x{background:none;border:0;color:var(--soft);font-size:22px}
.sw{appearance:none;width:44px;height:25px;border-radius:14px;background:var(--bg2);border:1px solid var(--gold);position:relative}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--gold);transition:.2s}
.sw:checked{background:var(--red)}.sw:checked::after{left:21px;background:#fbf3dc}
.stat{display:flex;text-align:center}.stat div{flex:1}.stat b{font-family:'Ruslan Display',serif;font-size:30px;color:var(--red);display:block;font-weight:400}
.candle{font-size:40px;text-align:center;filter:drop-shadow(0 0 10px #f0c75e)}
.modal{position:fixed;inset:0;background:rgba(20,5,7,.78);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.modal .card{max-width:420px;text-align:center}
.note{font-size:15px;color:var(--soft);font-style:italic}
nav button{font-size:12.5px!important;letter-spacing:.03em!important}
.inp{width:100%;font:inherit;padding:8px;margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:5px}
.stand{position:relative;height:250px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(#1b0709,#3a0d12);overflow:hidden;margin-bottom:10px}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,190,80,.3),transparent 65%);opacity:.3}
.stand.lit .glow{opacity:.6;animation:pulse 2.2s ease-in-out infinite}
.cells{position:absolute;left:0;right:0;bottom:36px;height:196px;display:grid;grid-template-columns:repeat(8,1fr);align-content:end;padding:0 10px}
.base{position:absolute;left:5%;right:5%;bottom:10px;height:26px;border-radius:3px;background:linear-gradient(#e0b95e,#6d4c14);box-shadow:0 4px 14px #000}
.kanun .base{height:34px;border-radius:2px 2px 0 0}
.kx{position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:#f0c75e;font-size:26px}
.cd{position:relative;height:84px;display:flex;justify-content:center;align-items:flex-end}
.wx{display:block;width:9px;height:54px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#e4c372,#fff1c2 50%,#d3a74f);box-shadow:0 0 6px rgba(255,200,100,.35)}
.fl{position:absolute;bottom:52px;width:10px;height:22px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff8d0 20%,#ffb33a 60%,#ff6a00);box-shadow:0 0 14px 5px rgba(255,170,40,.7);transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
.cd.new{animation:rise 10s ease-out both}
.cd.new .fl{animation:ign 10s both}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f0c75e)}
@keyframes fill{to{width:100%}}
@keyframes pulse{50%{opacity:.95}}
@keyframes flick{from{transform:scale(1,.9) rotate(-2deg)}to{transform:scale(.94,1.08) rotate(2deg)}}
@keyframes rise{0%{transform:translateY(240px);opacity:0}10%{opacity:1}35%{transform:translateY(-34px)}55%{transform:translateY(0)}100%{transform:none}}
@keyframes ign{0%,52%{transform:scale(0)}60%{transform:scale(1.6,1.9)}70%{transform:scale(1.1) rotate(3deg)}85%{transform:scale(.95,1.1) rotate(-3deg)}100%{transform:scale(1)}}
nav button{padding-left:0;padding-right:0}
.scene{position:relative;height:160px;border-radius:6px;border:1px solid var(--line);overflow:hidden;background:repeating-linear-gradient(135deg,#2c2623 0 14px,#3a322d 14px 28px)}
.scene .me{position:absolute;left:6%;bottom:8px;font-size:56px}
.scene .dr{position:absolute;bottom:8px;font-size:56px;transition:right .6s}
.bub{position:absolute;top:8px;left:8px;right:8px;text-align:center;background:#fbf3dc;color:#2e1a14;border-radius:8px;padding:3px 8px;font-size:15px;font-style:italic}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sc{position:relative;border-radius:6px;border:1px solid var(--line);overflow:hidden;line-height:0;background:#222}.sc svg{width:100%;height:auto;display:block}
.sc .bub{position:absolute;z-index:2;line-height:1.3}
.sway{animation:sway 1.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ringx .9s ease-out forwards}
@keyframes ringx{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}
.lamp{animation:lampf 3s infinite}@keyframes lampf{0%,100%{opacity:1}45%{opacity:.8}50%{opacity:.55}55%{opacity:.9}}
</style>
</head>
<body>
<header>
<svg class="cross" viewBox="0 0 34 44"><g fill="none" stroke="#f0c75e" stroke-width="2.2" stroke-linecap="round"><path d="M17 2v40M8 11h18M11 20h12"/><path d="M10 36l14-7" stroke-width="2"/></g></svg>
<h1>Молитвослов<br><span style="font-size:.6em;letter-spacing:.12em">от Банана</span></h1>
<div class="sub">✠ Господи, помилуй ✠</div>
<div class="date" id="date"></div><button id="snd" aria-label="Звук"></button>
</header>
<main id="main"></main>

<div class="reader" id="reader">
<div class="rbar"><button id="close">← Назад</button><span id="rtitle" style="font-family:'Cormorant SC',serif;letter-spacing:.06em"></span><span><button id="fm">А−</button> <button id="fp">А+</button></span></div>
<div style="max-width:640px;margin:0 auto;padding:18px 18px 40px" id="rbody"></div>
</div>

<div class="modal" id="modal"><div class="card"><div class="candle">🕯️</div><h2 id="mt">Час молитвы</h2><p id="mm"></p><button class="btn" id="mgo">Приступить к молитве</button><button class="btn alt" id="mx">Позже</button></div></div>
<nav id="nav"></nav>

<script>
const P=[
{id:'tsar',t:'Царю Небесный',c:'main',n:'Призывание Святого Духа',x:'Царю Небесный, Утешителю, Душе истины, Иже везде сый и вся исполняяй, Сокровище благих и жизни Подателю, прииди и вселися в ны, и очисти ны от всякия скверны, и спаси, Блаже, души наша.'},
{id:'tri',t:'Трисвятое',c:'main',n:'Читается с крестным знамением и поклонами',x:'Святый Боже, Святый Крепкий, Святый Безсмертный, помилуй нас. (Трижды)\nСлава Отцу и Сыну и Святому Духу, и ныне и присно и во веки веков. Аминь.\nПресвятая Троице, помилуй нас; Господи, очисти грехи наша; Владыко, прости беззакония наша; Святый, посети и исцели немощи наша, имене Твоего ради.\nГосподи, помилуй. (Трижды)\nСлава Отцу и Сыну и Святому Духу, и ныне и присно и во веки веков. Аминь.'},
{id:'otche',t:'Отче наш',c:'main',n:'Молитва Господня',x:'Отче наш, Иже еси на небесех! Да святится имя Твое, да приидет Царствие Твое, да будет воля Твоя, яко на небеси и на земли.\nХлеб наш насущный даждь нам днесь; и остави нам долги наша, якоже и мы оставляем должником нашым; и не введи нас во искушение, но избави нас от лукаваго.'},
{id:'bogo',t:'Богородице Дево, радуйся',c:'main',n:'Ангельское приветствие',x:'Богородице Дево, радуйся, Благодатная Марие, Господь с Тобою; благословена Ты в женах, и благословен плод чрева Твоего, яко Спаса родила еси душ наших.'},
{id:'sim',t:'Символ веры',c:'main',n:'Исповедание веры',x:'Верую во единаго Бога Отца, Вседержителя, Творца небу и земли, видимым же всем и невидимым.\nИ во единаго Господа Иисуса Христа, Сына Божия, Единороднаго, Иже от Отца рожденнаго прежде всех век; Света от Света, Бога истинна от Бога истинна, рожденна, несотворенна, единосущна Отцу, Имже вся быша.\nНас ради человек и нашего ради спасения сшедшаго с небес, и воплотившагося от Духа Свята и Марии Девы, и вочеловечшася.\nРаспятаго же за ны при Понтийстем Пилате, и страдавша, и погребенна.\nИ воскресшаго в третий день по Писанием.\nИ возшедшаго на небеса, и седяща одесную Отца.\nИ паки грядущаго со славою судити живым и мертвым, Егоже Царствию не будет конца.\nИ в Духа Святаго, Господа, Животворящаго, Иже от Отца исходящаго, Иже со Отцем и Сыном спокланяема и сславима, глаголавшаго пророки.\nВо едину Святую, Соборную и Апостольскую Церковь.\nИсповедую едино крещение во оставление грехов.\nЧаю воскресения мертвых, и жизни будущаго века. Аминь.'},
{id:'iis',t:'Иисусова молитва',c:'main',n:'Творится в любое время',x:'Господи Иисусе Христе, Сыне Божий, помилуй мя грешнаго.'},
{id:'angel',t:'Молитва Ангелу Хранителю',c:'main',n:'Небесному покровителю',x:'Ангеле Христов, хранителю мой святый и покровителю души и тела моего, вся мне прегрешшая днесь, прости, и от всякаго лукаваго мя супостата избави, да ни в коем гресе прогневаю Бога моего; но помолися о мне грешнем и недостойнем рабе, яко достойна мя покажеши благости и милосердия Всесвятыя Троицы и Матере Господа моего Иисуса Христа и всех святых. Аминь.'},
{id:'opt',t:'Молитва оптинских старцев',c:'morn',n:'На начало дня',x:'Господи, дай мне с душевным спокойствием встретить всё, что принесёт мне наступающий день. Дай мне всецело предаться воле Твоей святой. На всякий час сего дня во всём наставь и поддержи меня.\nКакие бы я ни получал известия в течение дня, научи меня принять их со спокойной душой и твёрдым убеждением, что на всё святая воля Твоя. Во всех словах и делах моих руководи моими мыслями и чувствами.\nВо всех непредвиденных случаях не дай мне забыть, что всё ниспослано Тобою. Научи меня прямо и разумно действовать с каждым членом семьи моей, никого не смущая и не огорчая.\nГосподи, дай мне силу перенести утомление наступающего дня и все события в течение его. Руководи моею волей и научи меня молиться, верить, надеяться, терпеть, прощать и любить. Аминь.'},
{id:'eve',t:'Молитва на сон грядущий',c:'eve',n:'Вечернее прошение о прощении',x:'Господи Боже наш, елика согреших во дне сем словом, делом и помышлением, яко Благ и Человеколюбец прости ми. Мирен сон и безмятежен даруй ми. Ангела Твоего хранителя пошли, покрывающа и соблюдающа мя от всякаго зла: яко Ты еси хранитель душ и телес наших, и Тебе славу возсылаем, Отцу и Сыну и Святому Духу, ныне и присно и во веки веков. Аминь.'},
{id:'dost',t:'Достойно есть',c:'eve',n:'Величание Богородицы',x:'Достойно есть яко воистину блажити Тя, Богородицу, Присноблаженную и Пренепорочную и Матерь Бога нашего. Честнейшую херувим и славнейшую без сравнения серафим, без истления Бога Слова рождшую, сущую Богородицу Тя величаем.'},
{id:'pre',t:'Молитва перед трапезой',c:'meal',n:'Перед принятием пищи',x:'Очи всех на Тя, Господи, уповают, и Ты даеши им пищу во благовремении, отверзаеши Ты щедрую руку Твою и исполняеши всякое животно благоволения.\nГосподи Иисусе Христе, Боже наш, благослови нам пищу и питие молитвами Пречистыя Твоея Матере и всех святых Твоих, яко благословен еси во веки веков. Аминь.'},
{id:'posle',t:'Благодарение после трапезы',c:'meal',n:'После принятия пищи',x:'Благодарим Тя, Христе Боже наш, яко насытил еси нас земных Твоих благ; не лиши нас и Небеснаго Твоего Царствия, но яко посреде учеников Твоих пришел еси, Спасе, мир даяй им, прииди к нам и спаси нас. Аминь.'},

const drunk=i=>{const[c,h]=[['#5b7a9a','#2d2d2d'],['#9a5b5b','#6b5a3a'],['#6a8a5b','#1e1e1e'],['#8a7a3b','#7a4a2a']][i%4];return `<g><path d="M26 118V92H38V118ZM42 118V92H54V118Z" fill="#3b3f4a"/><path d="M20 66Q40 54 60 66L62 100H18Z" fill="${c}"/><path d="M22 70L12 96M58 70L66 82" stroke="${c}" stroke-width="8" stroke-linecap="round"/><circle cx="40" cy="42" r="14" fill="#d9a77c"/><path d="M25 38Q40 18 55 38Q49 30 40 30Q31 30 25 38Z" fill="${h}"/><circle cx="35" cy="41" r="3" fill="#fff"/><circle cx="46" cy="40" r="3" fill="#fff"/><circle cx="36" cy="41.5" r="1.1" fill="#222"/><circle cx="45" cy="41.5" r="1.1" fill="#222"/><circle cx="41" cy="48" r="4" fill="#d9534f"/><path d="M34 54Q40 58 47 54" stroke="#4a2a2a" fill="none" stroke-width="1.5"/><g transform="translate(62 70) rotate(20)"><rect width="7" height="22" rx="2" fill="#2f7a3a"/><rect x="2" y="-7" width="3" height="8" fill="#2f7a3a"/></g></g>`};
const CHURCH=()=>`<div class="sc"><div class="bub">Вдали золотятся купола…</div><svg viewBox="0 0 360 200"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27325f"/><stop offset=".75" stop-color="#f0a870"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8892b"/><stop offset=".5" stop-color="#ffe07a"/><stop offset="1" stop-color="#b8892b"/></linearGradient><linearGradient id="rb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bdb39b"/><stop offset=".5" stop-color="#fffaf0"/><stop offset="1" stop-color="#bdb39b"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="360" height="200" fill="url(#sk)"/><g fill="#fff"><circle cx="40" cy="30" r="1.5"/><circle cx="90" cy="14" r="1"/><circle cx="310" cy="26" r="1.5"/><circle cx="270" cy="50" r="1"/></g><rect y="168" width="360" height="32" fill="#2a3a28"/><path d="M0 200L120 168H250L360 200Z" fill="#8a7a66"/><rect x="140" y="108" width="100" height="62" fill="#f3ead2"/><rect x="167" y="76" width="26" height="34" fill="#f3ead2"/><path d="M165 78Q180 38 195 78Z" fill="url(#gd)"/><path d="M180 40V20M174 27H186" stroke="#e0b440" stroke-width="2.5"/><rect x="124" y="124" width="22" height="46" fill="#efe4c4"/><path d="M122 126Q135 98 148 126Z" fill="url(#gd)"/><rect x="234" y="124" width="22" height="46" fill="#efe4c4"/><path d="M232 126Q245 98 258 126Z" fill="url(#gd)"/><path d="M170 170V142Q180 128 190 142V170Z" fill="#6a4328"/><path d="M152 150V132Q158 124 164 132V150ZM196 150V132Q202 124 208 132V150Z" fill="#27325f"/><g transform="translate(40 90) scale(.75)">${HERO}</g></svg></div>`;
const DR=[['Отче наш',['Отче наш, Иже еси на небесех!','Да святится имя Твое,','да приидет Царствие Твое,','да будет воля Твоя, яко на небеси и на земли.','Хлеб наш насущный даждь нам днесь;','и остави нам долги наша, якоже и мы оставляем должником нашым;','и не введи нас во искушение, но избави нас от лукаваго.']],
['Царю Небесный',['Царю Небесный, Утешителю, Душе истины,','Иже везде сый и вся исполняяй,','Сокровище благих и жизни Подателю,','прииди и вселися в ны,','и очисти ны от всякия скверны,','и спаси, Блаже, души наша.']],
['Богородице Дево',['Богородице Дево, радуйся,','Благодатная Марие, Господь с Тобою;','благословена Ты в женах,','и благословен плод чрева Твоего,','яко Спаса родила еси душ наших.']]];
const TAUNT=['Эй, братан, дай на опохмел!','Куда пошёл? Посиди с нами!','Налей-ка, святоша!','А ты чё это бормочешь?!'];
function game2(){let floor=5,faith=3,pr,step,prog,tmo,n=0,ring=false;const ALL=DR.flatMap(d=>d[1]);const alive=()=>document.getElementById('g2s');
const shuf=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
function head(){return `<div class="note" style="display:flex;justify-content:space-between"><span>Этаж: ${floor}</span><span>Вера: ${'✝ '.repeat(faith)}</span></div>`}
function scene(bub,prog,ring){const dx=130+prog*48;return `<div class="sc" id="g2s"><div class="bub">${bub}</div><svg viewBox="0 0 360 200"><defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52473b"/><stop offset="1" stop-color="#2a2420"/></linearGradient><linearGradient id="rb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bdb39b"/><stop offset=".5" stop-color="#fffaf0"/><stop offset="1" stop-color="#bdb39b"/></linearGradient><radialGradient id="lg"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient><radialGradient id="vg"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient><filter id="gl"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="360" height="200" fill="url(#wl)"/><rect y="108" width="360" height="70" fill="#35564f"/><rect y="106" width="360" height="4" fill="#d8cfb4" opacity=".55"/><g fill="#000" opacity=".12"><ellipse cx="90" cy="60" rx="26" ry="14"/><ellipse cx="300" cy="40" rx="22" ry="10"/><ellipse cx="250" cy="130" rx="30" ry="12"/></g>
<rect x="150" y="24" width="46" height="58" fill="#16264d" stroke="#6b5a45" stroke-width="4"/><path d="M173 24V82M150 53H196" stroke="#6b5a45" stroke-width="3"/><circle cx="185" cy="40" r="5" fill="#f1ecd0"/>
<path d="M240 190V150H270V130H300V110H330V90H360V190Z" fill="#2a2623"/><path d="M240 148L360 86" stroke="#15120f" stroke-width="3"/><path d="M252 142V176M276 130V176M300 118V176M324 106V176M348 94V176" stroke="#15120f" stroke-width="2"/>
<rect y="172" width="360" height="28" fill="#6b5b4a"/><path d="M0 172H360" stroke="#8a7a66" stroke-width="2"/><path d="M0 186H360M60 172L40 200M150 172L140 200M240 172L240 200M330 172L340 200" stroke="#4d4033"/>
<rect x="6" y="66" width="36" height="106" fill="#6a4328" stroke="#3a2210" stroke-width="3"/><circle cx="34" cy="122" r="2.5" fill="#d9b05a"/><rect x="14" y="74" width="20" height="14" fill="#d8cfb4"/><text x="24" y="85" font-size="11" text-anchor="middle" fill="#2e1a14" font-family="Georgia">${floor}</text>
<line x1="110" y1="0" x2="110" y2="18" stroke="#111"/><circle cx="110" cy="24" r="6" fill="#ffe9a0"/><circle class="lamp" cx="110" cy="24" r="70" fill="url(#lg)"/>
<g transform="translate(52 70)">${HERO}</g>${ring?'<circle class="ring" cx="92" cy="120" r="30" fill="none" stroke="#f0c75e" stroke-width="4"/>':''}
<g style="transform:translate(${dx}px,72px);transition:transform .6s"><g class="sway">${drunk(n)}</g></g><rect width="360" height="200" fill="url(#vg)"/></svg></div>`}
function fight(){ring=false;pr=DR[Math.floor(Math.random()*3)];step=1;prog=0;ask()}
function ask(){clearTimeout(tmo);const rg0=ring;const ok=pr[1][step],o=shuf([ok,...shuf(ALL.filter(l=>l!==ok)).slice(0,2)]);
$('#main').innerHTML=`<div class="card">${head()}${scene(TAUNT[n%4],prog,ring)}<div class="bar" style="margin:10px 0"><i style="animation:fill 9s linear forwards"></i></div>
<p style="text-align:center;margin:4px 0"><b>${pr[0]}</b><br><i>«${pr[1][step-1]}»</i></p><p class="note" style="text-align:center;margin:2px 0 8px">Что дальше? Выбери верные слова молитвы:</p>
${o.map(t=>`<button class="item" data-a="${esc(t)}"><span>${esc(t)}</span></button>`).join('')}</div>`;
ring=false;const pick=t=>{clearTimeout(tmo);if(t===ok){SND.good();SND.step();prog++;step++;ring=true;if(prog>=3)won();else ask()}else{SND.bad();faith--;if(faith<=0)lost();else{ $('#g2s').classList.add('shake');setTimeout(()=>{if(alive())ask()},450);document.querySelectorAll('[data-a]').forEach(b=>b.disabled=true)}}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>pick(b.dataset.a));tmo=setTimeout(()=>{if(alive())pick('')},9000)}
function won(){floor--;n++;SND.win();if(floor<=1){playSong();$('#main').innerHTML=`<div class="card"><h2>Ты на свободе!</h2>${CHURCH()}<p style="text-align:center">Последний пьяный, бормоча, отступил. Ты вышел из подъезда и направился в храм — искупать грехи молитвой и свечой.</p><p class="note" id="sn" style="text-align:center">🎵 Играет «Полный бак»</p><button class="btn alt" id="sg">⏸ Остановить песню</button><button class="btn" id="c1">🕯 Войти в храм и поставить свечу</button><button class="btn alt" id="c2">Прочесть покаянный псалом 50</button><button class="btn alt" id="c3">← К играм</button></div>`;mark();S.cand+=0;save();
$('#sg').onclick=()=>{if(song&&!song.paused){stopSong();$('#sg').textContent='▶ Включить песню'}else{playSong();$('#sg').textContent='⏸ Остановить песню'}};$('#c1').onclick=()=>{tab='temple';tm='r';render()};$('#c2').onclick=()=>{stopSong();prayer('ps50')};$('#c3').onclick=()=>{stopSong();games()}}
else{$('#main').innerHTML=`<div class="card">${head()}${scene('…бормочет и отступает',3)}<p style="text-align:center">Сосед, бормоча, отступил. Спускайся ниже — на этаж ${floor}.</p><button class="btn" id="nx2">Спускаться ниже</button></div>`;$('#nx2').onclick=fight}}
function lost(){SND.lose();$('#main').innerHTML=`<div class="card"><h2>Вера пошатнулась</h2><p style="text-align:center">Соседи затащили тебя на лавочку. Не унывай: помолись и попробуй снова!</p><button class="btn" id="rt">Ещё раз</button><button class="btn alt" id="c3">← К играм</button></div>`;$('#rt').onclick=game2;$('#c3').onclick=games}
fight()}
function bell(){const supp='Notification' in window;
$('#main').innerHTML=`<div class="card"><h2>Часы молитвы</h2><p class="note" style="text-align:center">Напомним о молитве в назначенный час</p>
<div id="rl">${S.rem.map(r=>`<div class="rem"><input type="checkbox" class="sw" data-i="${r.id}" ${r.on?'checked':''}><div>${r.l}</div><input type="time" value="${r.t}" data-t="${r.id}"><button class="x" data-d="${r.id}">×</button></div>`).join('')}</div>
<div class="orn">✠</div><div class="row"><input id="nl" placeholder="Название" style="flex:2;font:inherit;padding:8px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:5px"><input id="nt" type="time" value="12:00" style="flex:1;font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:5px"></div>
<button class="btn alt" id="add">+ Добавить напоминание</button>
<button class="btn" id="test">Проверить напоминание</button>${tg&&tg.initData?'<button class="btn" id="tgs">Сохранить в Telegram-боте</button>':''}</div>
<div class="card"><p class="note">Напоминания приходят, пока приложение открыто${supp?'. Разрешите уведомления для лучшего результата':''}. Нажмите «Сохранить в Telegram-боте» — бот будет присылать напоминания в чат в указанные часы, даже когда приложение закрыто.</p>${supp?'<button class="btn alt" id="perm">Разрешить уведомления</button>':''}</div>`;
document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{S.rem.find(r=>r.id==e.dataset.i).on=e.checked;save()});
document.querySelectorAll('[data-t]').forEach(e=>e.onchange=()=>{S.rem.find(r=>r.id==e.dataset.t).t=e.value;save()});
document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{S.rem=S.rem.filter(r=>r.id!=e.dataset.d);save();bell()});
$('#add').onclick=()=>{const l=$('#nl').value.trim()||'Час молитвы';S.rem.push({id:Date.now(),l,t:$('#nt').value||'12:00',on:true,r:null});save();bell()};
$('#test').onclick=()=>alarm({l:'Вечернее правило',r:'eve'});
if($('#tgs'))$('#tgs').onclick=()=>tg.sendData(JSON.stringify({rem:S.rem.map(r=>({l:r.l,t:r.t,on:r.on,r:r.r}))}));
if(supp&&$('#perm'))$('#perm').onclick=()=>{try{Notification.requestPermission()}catch(e){}}}
function alarm(r){pending=r;$('#mm').textContent=`«${r.l}». Оставь суету, предстань пред Господом.`;
$('#mgo').style.display=r.r?'block':'none';$('#modal').classList.add('show');
try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
try{if('Notification' in window&&Notification.permission==='granted')new Notification('Час молитвы',{body:r.l})}catch(e){}}
$('#mx').onclick=()=>$('#modal').classList.remove('show');
$('#mgo').onclick=()=>{$('#modal').classList.remove('show');const k=pending.r;if(RULES[k])rule(k);else prayer(k)};
setInterval(()=>{const d=new Date(),hm=d.toTimeString().slice(0,5),key=today();
S.rem.forEach(r=>{if(r.on&&r.t===hm&&S.fired[r.id]!==key+hm){S.fired[r.id]=key+hm;save();alarm(r)}})},15000);
const sndUI=()=>{$('#snd').textContent=S.snd===false?'🔇':'🔊'};sndUI();$('#snd').onclick=()=>{S.snd=S.snd===false;save();sndUI();if(S.snd===false)stopSong();else SND.ding()};
render();
(function(){const q=new URLSearchParams(location.search).get('r');if(q&&RULES[q])rule(q);else if(q&&byId[q])prayer(q)})();
</script>
